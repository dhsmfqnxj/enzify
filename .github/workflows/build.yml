name: Muhyeop build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muhyeop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TERM: xterm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            liblua5.4-dev libsqlite3-dev zlib1g-dev pkg-config python3-yaml \
            binutils-gold python-is-python3
          test -f /usr/include/term.h

      - name: Restore script permissions after Windows import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('source').rglob('*'):
              if path.is_file() and not path.is_symlink():
                  with path.open('rb') as stream:
                      is_script = stream.read(2) == b'#!'
                  if is_script:
                      path.chmod(path.stat().st_mode | 0o111)
          PY

      - name: Build Linux console game
        working-directory: source
        run: make -j2

      - name: Build and run full Catch2 test suite
        working-directory: source
        run: make -j2 catch2-tests
